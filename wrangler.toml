# Cloudflare Pages project config. `npm run build` produces `out/`: the static
# client assets plus the vinext server bundle as an advanced-mode `_worker.js/`.
name = "all-things-automated-website"
pages_build_output_dir = "out"
compatibility_date = "2024-11-15"
compatibility_flags = ["nodejs_compat"]

# CRM database: the website CRM's own D1 database (schema: migrations/0001_crm_schema.sql).
[[d1_databases]]
binding = "CRM_DB"
database_name = "ata-website-crm"
database_id = "b6a41513-f622-41cb-ae6f-0a940e028c82"

[vars]
# Google accounts allowed into /crm (comma-separated). Cloudflare Access must allow them too.
CRM_ALLOWED_EMAILS = "jorge@allthingsautomated.org"
# Set as encrypted secrets in Pages → Settings → Variables and Secrets (not here):
#   ACCESS_TEAM_DOMAIN, ACCESS_AUD, BESIDE_WEBHOOK_TOKEN
