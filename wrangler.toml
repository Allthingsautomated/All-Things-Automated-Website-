name = "all-things-automated-website"
main = "worker/index.ts"
compatibility_date = "2024-11-15"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "all-things-automated-website"

[[d1_databases]]
binding = "D1"
database_name = "all-things-automated"
database_id = "00000000-0000-4000-8000-000000000000"

[[r2_buckets]]
binding = "R2"
bucket_name = "all-things-automated"
